<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yaad – find a photo by describing it</title>
<style>
:root{--bg:#eef1f4;--ink:#14213d;--mute:#5b6678;--acc:#0f766e;--line:#cfd6df;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#10151d;--ink:#e6ebf2;--mute:#93a0b3;--acc:#5eead4;--line:#2a3442;--card:#182030}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:40px 20px 80px}
h1{font:400 clamp(30px,6vw,52px)/1.1 Georgia,"Times New Roman",serif;margin:0 0 12px;letter-spacing:-.01em;max-width:14em}
.sub{color:var(--mute);margin:0 0 28px;max-width:38em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;padding:10px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;font:inherit;cursor:pointer}
@media(prefers-color-scheme:dark){.btn{color:#062a26}}
.btn.ghost{background:transparent;color:var(--acc)}
.btn:focus-within,.btn:focus-visible,#q:focus{outline:3px solid var(--acc);outline-offset:2px}
#status{color:var(--mute);margin:14px 0 4px;min-height:1.5em}
progress{width:100%;height:6px;accent-color:var(--acc)}
form{display:flex;gap:10px;margin:22px 0 28px}
#q{flex:1;padding:14px 16px;font:inherit;font-size:18px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button:disabled,#q:disabled{opacity:.5;cursor:not-allowed}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
#grid
